server {
    listen 80;
    server_name alashqaasofascurtains.shop www.alashqaasofascurtains.shop;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Filament admin panel
    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Livewire routes (Filament dependency).
    #
    # Livewire v4 no longer serves from a fixed /livewire/ path. It derives an
    # APP_KEY-specific prefix - see EndpointResolver::prefix() - so the real URIs
    # look like /livewire-7a87583f/livewire.min.js, /livewire-<hash>/update and
    # /livewire-<hash>/upload-file, and the hash differs per environment.
    #
    # This regex MUST stay open-ended (no trailing slash, no anchor after
    # "livewire"). Narrowing it to "/livewire/" makes every hashed URI fall
    # through to Next.js and 404. Livewire ships Alpine.js, so losing
    # livewire.min.js leaves .fi-main-ctn stuck at opacity:0 and the Filament
    # admin renders as an empty shell.
    location ~ ^/livewire {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Filament asset routes (CSS, JS, fonts)
    location /filament {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /css/filament {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /js/filament {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fonts/filament {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel API routes.
    # The whole /api namespace belongs to Laravel. Do not add Next.js route
    # handlers under frontend/src/app/api - they are unreachable in production
    # because this block proxies /api/* to Laravel before Next.js ever sees it.
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel storage files
    location /storage {
        alias /home/ec2-user/curtain-buizz/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static assets
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
    }

    # Static files from public/
    location /images {
        alias /home/ec2-user/curtain-buizz/frontend/public/images;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /icons {
        alias /home/ec2-user/curtain-buizz/frontend/public/icons;
        expires 365d;
    }

    location /favicon.ico {
        alias /home/ec2-user/curtain-buizz/frontend/public/favicon.ico;
        expires 365d;
    }

    location /apple-touch-icon.png {
        alias /home/ec2-user/curtain-buizz/frontend/public/apple-touch-icon.png;
        expires 365d;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
